<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>G-Counter Simulator</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="node-card.css" />
    <link rel="stylesheet" href="error-popup.css" />
    <link rel="stylesheet" href="time-graph.css" />
    <link rel="stylesheet" href="client.css" />
    <script src="dist/script.js" defer></script>
  </head>

  <body>
    <div class="app">
      <header class="header">
        <h1>G-Counter Simulator</h1>
        <div class="header-controls">
          <!-- Drives how/when the pending step queue drains: Manual leaves it
               to "Next Step" clicks, Auto-play drains continuously at the
               chosen speed. See step-control.ts / timing.ts. -->
          <div class="step-control" role="group" aria-label="Step controls">
            <div class="step-mode-toggle" role="radiogroup" aria-label="Step mode">
              <button type="button" class="step-mode-btn" data-mode="manual" role="radio" aria-checked="true">
                Manual
              </button>
              <button type="button" class="step-mode-btn" data-mode="auto" role="radio" aria-checked="false">
                Auto-play
              </button>
            </div>

            <div id="step-manual-controls" class="step-manual-controls">
              <button id="next-step-button" type="button" class="btn btn-secondary step-btn step-next-button">
                Next Step
              </button>
            </div>

            <div id="step-auto-controls" class="step-auto-controls" hidden>
              <button
                id="play-pause-button"
                type="button"
                class="btn btn-secondary step-btn step-play-button"
                aria-label="Pause"
              >
                <span id="play-pause-icon" aria-hidden="true">&#9616;&#9616;</span>
                <span id="play-pause-label">Pause</span>
              </button>
              <select id="speed-select" class="step-speed-select" aria-label="Auto-play speed">
                <option value="0.5">0.5x</option>
                <option value="1" selected>1x</option>
                <option value="2">2x</option>
              </select>
            </div>
          </div>

          <div class="header-actions">
            <div class="create-node-menu">
              <button
                id="create-node-toggle"
                class="btn btn-secondary create-node-toggle"
                type="button"
                aria-label="Create node"
                aria-expanded="false"
                aria-controls="create-node-popup"
                title="Create node"
              >
                +
              </button>
              <div id="create-node-popup" class="create-node-popup" hidden>
                <label for="replica-id">Node name</label>
                <div class="create-node-popup-row">
                  <input
                    id="replica-id"
                    type="text"
                    maxlength="1"
                    pattern="[A-Z]"
                    placeholder="A"
                    autocomplete="off"
                  />
                  <button
                    class="btn btn-primary create-node-button"
                    type="button"
                    aria-label="Add node"
                    title="Add node"
                  >
                    Add
                  </button>
                </div>
              </div>
            </div>
            <button id="reset-button" class="btn btn-secondary">
              Reset Simulation
            </button>
          </div>
        </div>
      </header>

      <main class="layout">
        <section class="nodes-view">
          <div class="nodes-content" id="nodes-container"></div>

          <div class="clients" id="clients"></div>

          <div class="time-graph-widget">
            <h3 class="time-graph-title">Replication Timeline</h3>
            <div class="time-graph-scroll" id="time-graph-container">
              <p class="time-graph-empty">No steps yet</p>
            </div>
          </div>
        </section>

        <div
          id="critical-error-popup"
          class="critical-error-popup"
          role="alertdialog"
          aria-modal="true"
          aria-labelledby="critical-error-title"
          aria-describedby="critical-error-message"
          hidden
        >
          <div class="critical-error-dialog">
            <div class="critical-error-icon" aria-hidden="true">!</div>
            <h2 id="critical-error-title">Backend connection failed</h2>
            <p id="critical-error-message"></p>
            <button id="critical-error-close" class="btn" type="button">Close</button>
          </div>
        </div>

        <script src="dist/error-popup.js"></script>
        <script src="dist/api.js"></script>
        <script src="dist/timing.js"></script>
        <script src="dist/node-card.js"></script>
        <script src="dist/nodes.js"></script>
        <script src="dist/client.js"></script>
        <script src="dist/time-graph.js"></script>
        <script src="dist/steps.js"></script>
        <script src="dist/step-control.js"></script>
      </main>
    </div>
  </body>
</html>
