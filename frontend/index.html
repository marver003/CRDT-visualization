<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>G-Counter Simulator</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="node-card.css" />
    <link rel="stylesheet" href="error-popup.css" />
    <link rel="stylesheet" href="time-graph.css" />
    <script src="dist/script.js" defer></script>
  </head>

  <body>
    <div class="app">
      <header class="header">
        <h1>G-Counter Simulator</h1>
        <div class="header-actions">
            <input id="load-file-input" type="file" accept=".json" hidden>
            <button id="load-button" class="btn btn-secondary btn-load">
              <span class="load-icon">&#x2913;</span>
              Load State
            </button>
            <button class="btn btn-refresh">
              <span class="refresh-icon">&#x21BB;</span>
              Refresh
            </button>
            <button id="reset-button" class="btn btn-secondary">
              Reset Simulation
            </button>
          </div>
      </header>

      <main class="layout">
        <section class="nodes-view">
          <div class="nodes-content" id="nodes-container"></div>

          <!-- Only surviving piece of the old Controls panel. Everything else
               (Existing Nodes list, Merge Nodes) was dropped when the Nodes
               View became the whole page - see CLAUDE.md for the plan. -->
          <div class="section create-node-section create-node-widget">
            <h3>Create Node</h3>

            <p class="create-node-description">
              Add a replica to the counter network.
            </p>

            <div class="create-node-field">
              <div class="create-node-input-wrap">
                <label for="replica-id">Replica ID</label>
                <input
                  id="replica-id"
                  type="text"
                  maxlength="1"
                  pattern="[A-Z]"
                  placeholder="A"
                  aria-describedby="replica-id-help"
                />
              </div>
              <button
                class="btn btn-primary create-node-button"
                type="button"
                aria-label="Add node"
                title="Add node"
              >
                <span aria-hidden="true">+</span>
              </button>
            </div>
            <small id="replica-id-help" class="create-node-help">
              Choose one letter, for example A.
            </small>
          </div>

          <!-- Replication timeline: rows = replicas, columns = executed steps,
               loosely modeled on the Raft "servers x time" diagram. Replaces
               the old text-based Step Queue log. Built up client-side in
               time-graph.ts, since the backend only exposes pending steps. -->
          <div class="time-graph-widget">
            <h3 class="time-graph-title">Replication Timeline</h3>
            <div class="time-graph-scroll" id="time-graph-container">
              <p class="time-graph-empty">No steps yet</p>
            </div>
          </div>
        </section>

        <div
          id="critical-error-popup"
          class="critical-error-popup"
          role="alertdialog"
          aria-modal="true"
          aria-labelledby="critical-error-title"
          aria-describedby="critical-error-message"
          hidden
        >
          <div class="critical-error-dialog">
            <div class="critical-error-icon" aria-hidden="true">!</div>
            <h2 id="critical-error-title">Backend connection failed</h2>
            <p id="critical-error-message"></p>
            <button id="critical-error-close" class="btn" type="button">Close</button>
          </div>
        </div>

        <script src="dist/error-popup.js"></script>
        <script src="dist/api.js"></script>
        <script src="dist/node-card.js"></script>
        <script src="dist/nodes.js"></script>
        <script src="dist/time-graph.js"></script>
        <script src="dist/steps.js"></script>
      </main>
    </div>
  </body>
</html>
